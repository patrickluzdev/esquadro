# Releases esquadro from a tag (v0.1.0): binaries for macOS, Linux and
# Windows, their checksums, the notes grouped by commit type, and the
# Homebrew formula in patrickluzdev/homebrew-tap. Run by
# .github/workflows/release.yml; rehearse with:
#   goreleaser release --snapshot --clean
version: 2

project_name: esquadro

builds:
  - id: esquadro
    main: ./cmd/esquadro
    binary: esquadro
    env:
      - CGO_ENABLED=0
    goos: [darwin, linux, windows]
    goarch: [amd64, arm64]
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/patrickluzdev/esquadro/internal/version.Version={{ .Tag }}

archives:
  - id: esquadro
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

checksum:
  name_template: checksums.txt

changelog:
  use: git
  sort: asc
  groups:
    - title: Features
      regexp: '^feat(\(.+\))?!?:'
      order: 0
    - title: Fixes
      regexp: '^fix(\(.+\))?!?:'
      order: 1
    - title: Other changes
      order: 2
  filters:
    exclude:
      - '^docs(\(.+\))?:'
      - '^test(\(.+\))?:'
      - '^chore(\(.+\))?:'

brews:
  - name: esquadro
    repository:
      owner: patrickluzdev
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: https://patrickluzdev.github.io/esquadro/
    description: Generate Go projects from a model, with blueprints
    license: Apache-2.0
    commit_author:
      name: esquadro-release
      email: esquadro-release@users.noreply.github.com
    test: |
      system bin/"esquadro", "version"

release:
  github:
    owner: patrickluzdev
    name: esquadro
  # The VS Code extension is attached afterwards by release.yml.
