name: release

# A tag v* releases everything once CI passes: the binaries and the Homebrew
# formula (GoReleaser), then the VS Code extension at the tag's version,
# attached to the release and published to the Marketplace and Open VSX.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Package the extension at the tag's version
        working-directory: editors/vscode
        run: |
          npm ci
          npm version --no-git-tag-version "${GITHUB_REF_NAME#v}"
          npm test
          npm run compile
          npm run package
      - name: Attach the extension to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" editors/vscode/esquadro-*.vsix
      - name: Publish the extension
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          npx vsce publish --packagePath esquadro-*.vsix
          npx ovsx publish esquadro-*.vsix
