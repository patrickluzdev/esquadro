name: release

# A tag v* releases everything once CI passes: the binaries and the Homebrew
# formula (GoReleaser), then the VS Code extension at the tag's version,
# attached to the release and published to the Marketplace and Open VSX.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # To find the CI runs of the tagged commit.
  actions: read
  # The Marketplace and Open VSX check this workflow's identity (OIDC,
  # trusted publishing) instead of a token.
  id-token: write

jobs:
  # A tag is most often put on a commit of main whose CI already passed:
  # then the release goes at once, instead of running the same CI again.
  tested:
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.check.outputs.passed }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          n=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --branch main --commit "$GITHUB_SHA" --status success --json databaseId --jq length)
          if [ "$n" -gt 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
          echo "CI runs of $GITHUB_SHA that passed on main: $n"

  ci:
    needs: tested
    if: needs.tested.outputs.passed != 'true'
    uses: ./.github/workflows/ci.yml

  release:
    needs: [tested, ci]
    # Once the commit's CI passed, here or on main before.
    if: ${{ !cancelled() && needs.tested.result == 'success' && (needs.ci.result == 'success' || needs.ci.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - uses: goreleaser/goreleaser-action@v7.3.0
        with:
          distribution: goreleaser
          version: v2.20.2
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_GITHUB_TOKEN: ${{ secrets.HOMEBREW_TAP_GITHUB_TOKEN }}
      - name: Package the extension at the tag's version
        working-directory: editors/vscode
        run: |
          npm ci
          npm version --no-git-tag-version --allow-same-version "${GITHUB_REF_NAME#v}"
          npm test
          npm run compile
          npm run package
      - name: Attach the extension to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$GITHUB_REF_NAME" editors/vscode/esquadro-*.vsix
      - name: Publish the extension to the VS Code Marketplace
        working-directory: editors/vscode
        run: npx vsce publish --oidc --packagePath esquadro-*.vsix
      # Open VSX trusts this workflow for patrickluzdev.esquadro (registered
      # in its settings, Trusted Publishers).
      - name: Publish the extension to Open VSX
        working-directory: editors/vscode
        run: npx ovsx publish --trusted-publishing esquadro-*.vsix

  homebrew:
    needs: release
    uses: ./.github/workflows/homebrew.yml
