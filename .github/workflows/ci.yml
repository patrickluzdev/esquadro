name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  # Three jobs at once, each on its own runner: the slowest (the tests) sets
  # how long the CI takes, where one job ran them one after another.
  lint:
    name: lint, editor and docs (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Tools
        run: |
          go install github.com/go-task/task/v3/cmd/task@v3.54.0
          go install golang.org/x/tools/gopls@v0.24.0
      - run: task lint
      - run: task editor:test
      - run: task docs:check
      - run: task docs:build

  test:
    name: tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Tools
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - run: task test

  e2e:
    name: e2e (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # the canary upgrades a project from the last release's tag
          fetch-depth: 0
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24
      - name: Tools
        run: go install github.com/go-task/task/v3/cmd/task@v3.54.0
      - run: task e2e

  # Windows is not supported yet.
  macos:
    name: tests (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - run: go vet ./...
      # Without Docker (the runners have none): the tests that run Postgres
      # are skipped with -short.
      - run: go test -short ./...
