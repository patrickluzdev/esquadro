# Generated by esquadro: Grafana and what feeds it.
- name: Create the observability folder
  ansible.builtin.file:
    path: "{{ platform_root }}/observability"
    state: directory
    mode: "0750"

- name: Keep Grafana's passwords where only root reads them
  ansible.builtin.copy:
    content: |
      GF_SECURITY_ADMIN_PASSWORD={{ grafana_password }}
      {% if alerts_telegram_token | default('') != '' %}
      ALERTS_TELEGRAM_TOKEN={{ alerts_telegram_token }}
      {% endif %}
      {% if mail_owner is defined %}
      GF_SMTP_PASSWORD={{ mail_smtp_password }}
      {% endif %}
    dest: "{{ platform_root }}/observability/.env"
    mode: "0600"
  no_log: true
  register: observability_env

- name: Create the folder of Grafana's alerts
  ansible.builtin.file:
    path: "{{ platform_root }}/observability/alerting"
    state: directory
    mode: "0755"

- name: Write Grafana's alerts, to the platform's owner
  ansible.builtin.template:
    src: alerts.yaml.j2
    dest: "{{ platform_root }}/observability/alerting/platform.yaml"
    mode: "0644"
  register: observability_alerts

- name: Create the folder of the apps' dashboards
  ansible.builtin.file:
    path: "{{ platform_root }}/observability/dashboards"
    state: directory
    mode: "0755"

- name: Write each app's dashboard
  ansible.builtin.template:
    src: dashboard.json.j2
    dest: "{{ platform_root }}/observability/dashboards/{{ app.name }}.json"
    mode: "0644"
  loop: "{{ platform_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
  register: observability_dashboards

- name: Tell Grafana where the apps' dashboards are
  ansible.builtin.copy:
    content: |
      # Generated by esquadro: the apps' dashboards, in the folder Apps.
      apiVersion: 1
      providers:
        - name: apps
          folder: Apps
          type: file
          allowUiUpdates: false
          options:
            path: /otel-lgtm/apps-dashboards
    dest: "{{ platform_root }}/observability/dashboards.yaml"
    mode: "0644"
  register: observability_dashboards_provider

- name: Write the collector of the server's metrics
  ansible.builtin.copy:
    src: hostmetrics.yaml
    dest: "{{ platform_root }}/observability/hostmetrics.yaml"
    mode: "0644"
  register: observability_collector

- name: Write the compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ platform_root }}/observability/compose.yaml"
    mode: "0644"

- name: Run Grafana and the collector
  community.docker.docker_compose_v2:
    project_src: "{{ platform_root }}/observability"
    state: present
    recreate: >-
      {{ 'always' if (observability_collector is changed or observability_env is changed or observability_alerts is changed
                      or observability_dashboards is changed or observability_dashboards_provider is changed)
         else 'auto' }}
    wait: true
    wait_timeout: 180

- name: Give Grafana's admin the owner's email, for password resets
  ansible.builtin.uri:
    url: http://127.0.0.1:3000/api/user
    method: PUT
    url_username: admin
    url_password: "{{ grafana_password }}"
    force_basic_auth: true
    body_format: json
    body: {login: admin, name: admin, email: "{{ mail_owner }}"}
  when: mail_owner is defined
  no_log: true
  changed_when: false
