# Generated by esquadro: the server's CPU, memory, disk and network, every
# 30 seconds, to Grafana.
receivers:
  hostmetrics:
    root_path: /hostfs
    collection_interval: 30s
    scrapers:
      cpu: {}
      load: {}
      memory: {}
      disk: {}
      filesystem: {}
      network: {}
processors:
  resourcedetection:
    detectors: [system]
  batch: {}
exporters:
  otlp_http:
    endpoint: http://otel-lgtm:4318
service:
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [resourcedetection, batch]
      exporters: [otlp_http]
