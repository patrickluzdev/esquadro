# Generated by esquadro: Caddy, the platform's door to the internet.
- name: Create Caddy's folders
  ansible.builtin.file:
    path: "{{ platform_root }}/caddy/{{ item }}"
    state: directory
    mode: "0755"
  loop: [etc, etc/sites]

- name: Write Caddy's compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ platform_root }}/caddy/compose.yaml"
    mode: "0644"

- name: Write the Caddyfile, with the apps' domains
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: "{{ platform_root }}/caddy/etc/Caddyfile"
    mode: "0644"
  notify: Reload caddy

- name: Copy your own sites
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ platform_root }}/caddy/etc/sites/"
    mode: "0644"
  loop: "{{ query('ansible.builtin.fileglob', playbook_dir ~ '/../caddy/sites/*.caddy') }}"
  notify: Reload caddy

- name: Find the sites on the server
  ansible.builtin.find:
    paths: "{{ platform_root }}/caddy/etc/sites"
    patterns: "*.caddy"
  register: caddy_server_sites

- name: Remove the sites you removed
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ caddy_server_sites.files }}"
  loop_control:
    label: "{{ item.path | basename }}"
  when: (item.path | basename) not in (query('ansible.builtin.fileglob', playbook_dir ~ '/../caddy/sites/*.caddy') | map('basename'))
  notify: Reload caddy

- name: Run Caddy
  community.docker.docker_compose_v2:
    project_src: "{{ platform_root }}/caddy"
    state: present
