# Generated by esquadro.
[defaults]
inventory = inventory.yml
roles_path = roles
interpreter_python = auto_silent
# A change made before a failure still restarts what it needs to.
force_handlers = True
stdout_callback = default
callback_result_format = yaml

[ssh_connection]
# A new server's key is trusted the first time, then checked.
ssh_args = -o StrictHostKeyChecking=accept-new -o ControlMaster=auto -o ControlPersist=60s
pipelining = true
