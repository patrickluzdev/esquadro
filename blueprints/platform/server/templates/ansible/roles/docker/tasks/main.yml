# Generated by esquadro: Docker from Docker's own repository for Debian.
- name: Trust Docker's packages
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/debian/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"

- name: Add Docker's repository
  ansible.builtin.deb822_repository:
    name: docker
    types: [deb]
    uris: https://download.docker.com/linux/debian
    suites: ["{{ ansible_facts['distribution_release'] }}"]
    components: [stable]
    signed_by: /etc/apt/keyrings/docker.asc

- name: Install Docker and Compose
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
      - python3-docker
    update_cache: true

- name: Rotate the containers' logs, and keep them running while Docker restarts
  ansible.builtin.copy:
    src: daemon.json
    dest: /etc/docker/daemon.json
    mode: "0644"
  notify: Restart docker

- name: Start Docker with the server
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started

- name: Let the admin user run Docker
  ansible.builtin.user:
    name: "{{ platform_admin_user }}"
    groups: [docker]
    append: true

- name: Create the platform's network
  community.docker.docker_network:
    name: "{{ platform_network }}"

- name: Create the platform's folder
  ansible.builtin.file:
    path: "{{ platform_root }}"
    state: directory
    mode: "0755"
