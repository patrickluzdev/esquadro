# Generated by esquadro: the system every server starts from.
- name: Install the base packages
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - ufw
      - unattended-upgrades
      - apt-listchanges
    update_cache: true
    cache_valid_time: 3600

- name: Install security updates every day, by themselves
  ansible.builtin.copy:
    src: 20auto-upgrades
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: "0644"

- name: Set the time zone
  community.general.timezone:
    name: "{{ platform_timezone }}"

- name: Sign in by key only, and never as root
  ansible.builtin.copy:
    src: sshd.conf
    dest: /etc/ssh/sshd_config.d/10-platform.conf
    mode: "0644"
  notify: Restart ssh

- name: Keep the system journal small
  ansible.builtin.copy:
    src: journald.conf
    dest: /etc/systemd/journald.conf.d/10-platform.conf
    mode: "0644"
  notify: Restart journald

- name: Let SSH through the firewall
  community.general.ufw:
    rule: limit
    port: "22"
    proto: tcp

- name: Let the platform's ports through the firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ platform_ports }}"

- name: Turn the firewall on, refusing everything else
  community.general.ufw:
    state: enabled
    policy: deny
    direction: incoming
