# Generated by esquadro: prepares a new server, signing in as root once.
# Afterwards root has no login: task apply signs in as the admin user.
- name: Give a new server its admin user
  hosts: platform
  vars:
    ansible_user: root
  gather_facts: false
  tasks:
    - name: Install sudo
      ansible.builtin.apt:
        name: sudo
        update_cache: true

    - name: Create the admin user
      ansible.builtin.user:
        name: "{{ platform_admin_user }}"
        groups: [sudo]
        append: true
        shell: /bin/bash

    - name: Let the admin user sign in with your key
      ansible.posix.authorized_key:
        user: "{{ platform_admin_user }}"
        key: "{{ lookup('ansible.builtin.file', platform_ssh_key | expanduser) }}"

    - name: Let the admin user use sudo without a password, which it has none of
      ansible.builtin.copy:
        dest: /etc/sudoers.d/platform-admin
        content: "{{ platform_admin_user }} ALL=(ALL) NOPASSWD:ALL\n"
        mode: "0440"
        validate: visudo -cf %s
