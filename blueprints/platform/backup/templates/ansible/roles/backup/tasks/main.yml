# Generated by esquadro: the daily backups of the apps' databases.
- name: Install rclone, which writes to the bucket
  ansible.builtin.apt:
    name: rclone

- name: Create the backup folder
  ansible.builtin.file:
    path: "{{ platform_root }}/backup"
    state: directory
    mode: "0700"

- name: Keep the bucket's keys where only root reads them
  ansible.builtin.template:
    src: rclone.env.j2
    dest: "{{ platform_root }}/backup/rclone.env"
    mode: "0600"
  no_log: true

- name: Install the backup and restore commands
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ platform_root }}/bin/{{ item }}"
    mode: "0755"
  loop: [backup, restore]

- name: Write the apps whose databases are backed up
  ansible.builtin.copy:
    content: "{{ platform_apps | selectattr('database') | map(attribute='name') | join('\n') }}\n"
    dest: "{{ platform_root }}/backup/apps"
    mode: "0644"

- name: Run the backup every day
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    mode: "0644"
  loop: [platform-backup.service, platform-backup.timer]
  notify: Reload systemd

- name: Start the backup's timer
  ansible.builtin.systemd_service:
    name: platform-backup.timer
    enabled: true
    state: started
    daemon_reload: true
