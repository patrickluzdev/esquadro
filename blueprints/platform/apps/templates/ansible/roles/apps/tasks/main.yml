# Generated by esquadro: the apps the platform runs, and their deploys.
- name: Create the deploy user, which can only run the deploy
  ansible.builtin.user:
    name: deploy
    shell: /bin/sh
    password: "!"

- name: Let the deploy user run the deploy, and nothing else, as root
  ansible.builtin.copy:
    dest: /etc/sudoers.d/platform-deploy
    content: "deploy ALL=(root) NOPASSWD: /opt/platform/bin/deploy\n"
    mode: "0440"
    validate: visudo -cf %s

- name: Create the folder of the platform's commands
  ansible.builtin.file:
    path: "{{ platform_root }}/bin"
    state: directory
    mode: "0755"

- name: Install the deploy and status commands
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ platform_root }}/bin/{{ item }}"
    mode: "0755"
  loop: [deploy, status]

- name: Gather the apps' deploy keys
  ansible.builtin.set_fact:
    apps_keys: >-
      {{ apps_keys | default([]) + ['restrict,command="sudo -n ' ~ platform_root ~ '/bin/deploy ' ~ item.name ~ ' \"$SSH_ORIGINAL_COMMAND\"" '
         ~ lookup('ansible.builtin.file', playbook_dir ~ '/../deploy-keys/' ~ item.name ~ '.pub')] }}
  loop: "{{ platform_apps }}"
  loop_control:
    label: "{{ item.name }}"
  when: (playbook_dir ~ '/../deploy-keys/' ~ item.name ~ '.pub') is file

- name: Let each app's key deploy that app only
  ansible.posix.authorized_key:
    user: deploy
    exclusive: true
    key: "{{ (apps_keys | default([])) | join('\n') }}"

- name: Run each app
  ansible.builtin.include_tasks: app.yml
  loop: "{{ platform_apps }}"
  loop_control:
    loop_var: app
    label: "{{ app.name }}"
