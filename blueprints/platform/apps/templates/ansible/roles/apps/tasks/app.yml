# Generated by esquadro: one app, without changing the version it runs.
- name: Create the app's folder, {{ app.name }}
  ansible.builtin.file:
    path: "{{ platform_root }}/apps/{{ app.name }}"
    state: directory
    mode: "0750"

- name: Read the app's production variables, {{ app.name }}
  ansible.builtin.set_fact:
    apps_secrets: >-
      {{ lookup('community.sops.sops', playbook_dir ~ '/../secrets/apps/' ~ app.name ~ '.sops.env',
         input_type='dotenv', output_type='dotenv') }}
  no_log: true

- name: Write the app's variables, {{ app.name }}
  ansible.builtin.template:
    src: app.env.j2
    dest: "{{ platform_root }}/apps/{{ app.name }}/app.env"
    mode: "0600"
  no_log: true
  register: apps_env_file

- name: Write the app's compose file, {{ app.name }}
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ platform_root }}/apps/{{ app.name }}/compose.yaml"
    mode: "0644"
  register: apps_compose

- name: Write the image the deploy pulls, {{ app.name }}
  ansible.builtin.copy:
    content: "{{ app.image }}\n{{ 'database' if app.database else '' }}\n"
    dest: "{{ platform_root }}/apps/{{ app.name }}/image"
    mode: "0644"

- name: Start with no version, until the first deploy, {{ app.name }}
  ansible.builtin.copy:
    content: "VERSION=\n"
    dest: "{{ platform_root }}/apps/{{ app.name }}/.env"
    mode: "0644"
    force: false

- name: Read the version the app runs, {{ app.name }}
  ansible.builtin.slurp:
    src: "{{ platform_root }}/apps/{{ app.name }}/.env"
  register: apps_version

- name: Apply the changes at the version the app runs, {{ app.name }}
  community.docker.docker_compose_v2:
    project_src: "{{ platform_root }}/apps/{{ app.name }}"
    state: present
    wait: true
    wait_timeout: 120
  when:
    - (apps_version.content | b64decode | trim) != 'VERSION='
    - apps_env_file is changed or apps_compose is changed
