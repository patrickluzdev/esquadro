# Generated by esquadro: how the server sends the platform's emails.
- name: Check the email provider has its secret
  ansible.builtin.assert:
    that: >-
      {{ (mail_api_key | default('') | length > 0) if mail_provider == 'resend'
         else (mail_smtp_url | default('') | length > 0) }}
    fail_msg: "The platform's email needs {{ 'mail_api_key' if mail_provider == 'resend' else 'mail_smtp_url' }}: fill it in with task secrets:edit."
    quiet: true

- name: Create the email folder
  ansible.builtin.file:
    path: "{{ platform_root }}/mail"
    state: directory
    mode: "0700"

- name: Keep the provider's credentials where only root reads them
  ansible.builtin.template:
    src: netrc.j2
    dest: "{{ platform_root }}/mail/netrc"
    mode: "0600"
  no_log: true

- name: Write who sends and receives the platform's emails
  ansible.builtin.template:
    src: mail.env.j2
    dest: "{{ platform_root }}/mail/mail.env"
    mode: "0600"

- name: Create the folder of the platform's commands
  ansible.builtin.file:
    path: "{{ platform_root }}/bin"
    state: directory
    mode: "0755"

- name: Install the notify command
  ansible.builtin.copy:
    src: notify
    dest: "{{ platform_root }}/bin/notify"
    mode: "0755"
