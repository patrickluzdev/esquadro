# Generated by esquadro: the provider's SMTP, whatever it is, for Grafana,
# the backup and the tests; and the MAIL_URL the apps get.
mail_smtp_host: "{{ 'smtp.resend.com' if mail_provider == 'resend' else (mail_smtp_url | urlsplit('hostname')) }}"
mail_smtp_port: "{{ 465 if mail_provider == 'resend' else (mail_smtp_url | urlsplit('port') | default(587, true)) }}"
mail_smtp_user: "{{ 'resend' if mail_provider == 'resend' else (mail_smtp_url | urlsplit('username') | default('', true) | urldecode) }}"
mail_smtp_password: "{{ mail_api_key if mail_provider == 'resend' else (mail_smtp_url | urlsplit('password') | default('', true) | urldecode) }}"
mail_url: "{{ 'resend://' ~ mail_api_key if mail_provider == 'resend' else mail_smtp_url }}"
mail_from_address: "{{ (mail_from | regex_search('<([^>]+)>', '\\1') or [mail_from]) | first }}"
mail_from_name: "{{ mail_from | regex_replace('\\s*<[^>]*>\\s*$', '') if '<' in mail_from else '' }}"
