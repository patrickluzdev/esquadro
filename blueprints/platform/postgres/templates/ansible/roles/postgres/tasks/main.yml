# Generated by esquadro: PostgreSQL, and a database for each app with
# database.
- name: Create PostgreSQL's folders
  ansible.builtin.file:
    path: "{{ platform_root }}/postgres/{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "", mode: "0755" }
    - { path: conf, mode: "0755" }
    - { path: conf/conf.d, mode: "0755" }
    - { path: passwords, mode: "0700" }

- name: Write PostgreSQL's compose file
  ansible.builtin.template:
    src: compose.yaml.j2
    dest: "{{ platform_root }}/postgres/compose.yaml"
    mode: "0644"

- name: Keep the postgres user's password where only root reads it
  ansible.builtin.copy:
    content: "POSTGRES_PASSWORD={{ postgres_password }}\n"
    dest: "{{ platform_root }}/postgres/.env"
    mode: "0600"
  no_log: true

- name: Write the settings, sized to the server's memory
  ansible.builtin.template:
    src: postgresql.conf.j2
    dest: "{{ platform_root }}/postgres/conf/postgresql.conf"
    mode: "0644"
  notify: Restart postgres

- name: Copy your own settings
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../postgres/local.conf"
    dest: "{{ platform_root }}/postgres/conf/conf.d/local.conf"
    mode: "0644"
  notify: Restart postgres

- name: Run PostgreSQL
  community.docker.docker_compose_v2:
    project_src: "{{ platform_root }}/postgres"
    state: present
    wait: true

- name: Generate each app's password, once
  ansible.builtin.shell:
    cmd: umask 077 && python3 -c 'import secrets; print(secrets.token_hex(32), end="")' > {{ item.snake }}
    chdir: "{{ platform_root }}/postgres/passwords"
    creates: "{{ item.snake }}"
  loop: "{{ platform_apps | selectattr('database') }}"
  loop_control:
    label: "{{ item.name }}"

- name: Read the apps' passwords
  ansible.builtin.slurp:
    src: "{{ platform_root }}/postgres/passwords/{{ item.snake }}"
  loop: "{{ platform_apps | selectattr('database') }}"
  loop_control:
    label: "{{ item.name }}"
  register: postgres_passwords
  no_log: true

- name: Create each app's user and database
  community.docker.docker_container_exec:
    container: postgres
    command: psql -U postgres -v ON_ERROR_STOP=1 -q
    stdin: |
      \set app {{ item.item.snake }}
      \set password {{ item.content | b64decode }}
      {{ lookup('ansible.builtin.file', 'app.sql') }}
  loop: "{{ postgres_passwords.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  register: postgres_created
  changed_when: "'created' in postgres_created.stdout"
  no_log: true

- name: Tell the apps where their databases are
  ansible.builtin.set_fact:
    postgres_urls: "{{ postgres_urls | default({}) | combine({item.item.name: postgres_url}) }}"
  vars:
    postgres_url: >-
      postgres://{{ item.item.snake }}:{{ item.content | b64decode }}@postgres:5432/{{ item.item.snake }}?sslmode=disable
  loop: "{{ postgres_passwords.results }}"
  loop_control:
    label: "{{ item.item.name }}"
  no_log: true
