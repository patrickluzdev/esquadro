version: '3'

vars:
  BINARY: esquadro
  VERSION:
    sh: git describe --tags --always --dirty 2>/dev/null || echo dev

tasks:
  default:
    cmds:
      - task --list

  build:
    desc: Build the esquadro binary into bin/
    cmds:
      - go build -ldflags "-X github.com/patrickluzdev/esquadro/internal/version.Version={{.VERSION}}" -o bin/{{.BINARY}} ./cmd/esquadro

  install:
    desc: Install esquadro on your PATH (go install)
    cmds:
      - go install -ldflags "-X github.com/patrickluzdev/esquadro/internal/version.Version={{.VERSION}}" ./cmd/esquadro

  run:
    desc: 'Run esquadro without installing (arguments go after --, e.g. task run -- version)'
    cmds:
      - go run ./cmd/esquadro {{.CLI_ARGS}}

  test:
    desc: Run tests
    cmds:
      - go test ./...

  e2e:
    desc: Follow a generated project through its life, the tutorial step by step and every kind of project, against Postgres (needs Docker; minutes)
    cmds:
      - go test -tags e2e -run 'TestLifecycle|TestTutorial|TestEveryKindOfProjectRuns' -count 1 -timeout 30m -v ./cmd/esquadro

  editor:test:
    desc: Test the VS Code extension's grammar
    dir: editors/vscode
    cmds:
      - npm ci --silent
      - npm test

  editor:package:
    desc: Build the VS Code extension into editors/vscode/esquadro-<version>.vsix
    dir: editors/vscode
    cmds:
      - npm ci --silent
      - npm test
      - npm run compile
      - npm run package

  docs:gen:
    desc: Write the documentation's reference pages (blueprints, CLI) from esquadro itself
    cmds:
      - go run ./cmd/esquadro docs docs/src/content/docs

  docs:check:
    desc: Fail when the documentation's reference pages are out of date
    cmds:
      - task: docs:gen
      - git diff --exit-code -- docs/src/content/docs

  docs:
    desc: Serve the documentation site locally, with live reload
    dir: docs
    cmds:
      - npm ci --silent
      - npx astro dev

  docs:build:
    desc: Build the documentation site into docs/dist
    dir: docs
    cmds:
      - npm ci --silent
      - npx astro build

  test:update:
    desc: Rewrite golden files after an intended output change (review the diff!)
    cmds:
      - go test ./internal/dsl ./internal/project ./internal/blueprint ./internal/compose -run Golden -update

  fuzz:
    desc: 'Fuzz the DSL parser and formatter (default 1m each, e.g. task fuzz -- 5m)'
    vars:
      TIME: '{{.CLI_ARGS | default "1m"}}'
    cmds:
      # A short minimize time keeps the fuzzer from pausing up to 60s on every
      # new interesting input.
      - go test ./internal/dsl -run '^$' -fuzz FuzzParse -fuzztime {{.TIME}} -fuzzminimizetime 1s
      - go test ./internal/dsl -run '^$' -fuzz FuzzFormat -fuzztime {{.TIME}} -fuzzminimizetime 1s

  lint:
    desc: Check formatting, run go vet and gopls checks
    cmds:
      - test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)
      - go vet ./...
      - go vet -tags e2e ./cmd/esquadro
      # The same analyzers editors show (modernize, simplifications, unused
      # parameters...). Fails on any finding, hints included.
      - |
        out=$(gopls check -severity=hint $(find . -name '*.go' -not -path './.git/*') 2>&1)
        if [ -n "$out" ]; then echo "$out"; exit 1; fi
